name: Task
description: A piece of work with clear acceptance criteria
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [sc, engine, fe, design, scripts, docs]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done, and why. Link the PRD section.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements (tests that pass, commands that output X, screens that show Y).
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
